name: Archive validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  archive-check:
    name: archive-check
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out the archive
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node.js 24)
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Run meaningful tool tests
        run: python3 -m unittest discover -s tests -v
      - name: Validate archive structure and publication patterns
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          if [[ "$PR_HEAD_REF" == ai/restore-* ]]; then
            python3 scripts/validate_archive.py --base "$PR_BASE_SHA" --head "$PR_HEAD_SHA" --restore
          elif [ -n "$PR_BASE_SHA" ]; then
            python3 scripts/validate_archive.py --base "$PR_BASE_SHA"
          else
            python3 scripts/validate_archive.py
          fi
